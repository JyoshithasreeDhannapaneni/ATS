services:
  ats-postgres:
    image: postgres:16-alpine
    container_name: ats-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cats_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Joshi@515
    volumes:
      - ats_db_data:/var/lib/postgresql/data
      - ./db/cats_schema_postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cats_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ats-network

  ats-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats-app
    ports:
      - "8080:80"
    environment:
      PORT: "80"
      DATABASE_HOST: ats-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASS: Joshi@515
      DATABASE_NAME: cats_dev
    depends_on:
      ats-postgres:
        condition: service_healthy
    volumes:
      - ats_attachments:/var/www/html/attachments
      - ats_uploads:/var/www/html/uploads
      - ats_temp:/var/www/html/temp
    restart: unless-stopped
    networks:
      - ats-network

  ats-pgadmin:
    image: dpage/pgadmin4
    container_name: ats-pgadmin
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ats.local
      PGADMIN_DEFAULT_PASSWORD: Admin@12345
    depends_on:
      - ats-postgres
    restart: unless-stopped
    networks:
      - ats-network

volumes:
  ats_db_data:
  ats_attachments:
  ats_uploads:
  ats_temp:

networks:
  ats-network:
    driver: bridge
