name: Deploy to Production

# Manual trigger only — no push trigger. Deploying requires someone to
# deliberately click "Run workflow" on the Actions tab and pick a branch
# (requires write access to the repo, not admin). This is the approval gate:
# nothing deploys just because code was pushed. Whichever branch/ref is
# selected when dispatching is the branch that gets deployed — the server
# checks out that exact ref rather than assuming main.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/ATS
            git fetch origin
            # checkout refuses whenever the working tree has local edits to a
            # file that also changed upstream, even if the two now agree - so
            # switch branch (best-effort) then force the tree to match the
            # target ref exactly, rather than relying on checkout's conflict
            # detection. Untracked files (deploy_key, data/, etc.) are left alone.
            git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}" || true
            git reset --hard "origin/${{ github.ref_name }}"
            docker compose -f docker-compose.local.yml up -d --build
            # config.php and INSTALL_BLOCK have no volume mount, so a fresh
            # --build loses them unless they already exist on the host. Copy
            # whatever the container has out to the host once so the bind
            # mounts added in docker-compose.local.yml pick them up from now on.
            docker exec ats-app test -f /var/www/html/INSTALL_BLOCK || docker exec ats-app touch /var/www/html/INSTALL_BLOCK
            test -f ./config.php || docker cp ats-app:/var/www/html/config.php ./config.php
            test -f ./INSTALL_BLOCK || docker cp ats-app:/var/www/html/INSTALL_BLOCK ./INSTALL_BLOCK
            # config.php/INSTALL_BLOCK are bind-mounted from the host, so they keep
            # whatever ownership they had when copied out (root, since deploy runs
            # as root over SSH) rather than the image's own build-time
            # `chown -R www-data` layer. Apache's actual request-handling workers
            # run as www-data, so a root-owned 644 file is read-only to them -
            # SettingsUI.php's is_writable() check on the SMTP settings save
            # silently fails and the whole config.php rewrite no-ops. Re-assert
            # www-data ownership every deploy (idempotent, cheap) so it self-heals
            # even if it ever drifts back.
            docker exec ats-app chown www-data:www-data /var/www/html/config.php /var/www/html/INSTALL_BLOCK
            # TEMP: pre-flight syntax check on the new pipeline email queue
            # code before it's exposed to any real status change, plus
            # create the queue table it depends on. Will remove once the
            # feature is confirmed working end-to-end.
            docker exec ats-app php -l /var/www/html/lib/PipelineEmailAutomation.php
            docker exec ats-app php -l /var/www/html/cron/process-pipeline-email-queue.php
            docker exec -i ats-mysql sh -c 'mysql -uatsuser -p"$MYSQL_PASSWORD" opencats' < db/upgrade-pipeline-email-queue.sql
            docker exec ats-mysql sh -c 'mysql -uatsuser -p"$MYSQL_PASSWORD" opencats -e "DESCRIBE pipeline_email_queue"'
            # -l only checks syntax, not undefined constants/classes that
            # only surface at runtime - the queue is empty right now, so
            # actually running the worker is a safe, harmless way to
            # exercise the real include chain and DB connection.
            docker exec --user www-data ats-app php /var/www/html/cron/process-pipeline-email-queue.php
            # TEMP end-to-end test: insert one realistic pending row
            # (candidate_id/joborder_id/status_id are dummy - the send
            # path only needs recipient/subject/body/user_id, not real
            # candidate/joborder rows) addressed to my own inbox, run the
            # worker for real, and check the result.
            docker exec ats-mysql sh -c 'mysql -uatsuser -p"$MYSQL_PASSWORD" opencats -e "INSERT INTO pipeline_email_queue (candidate_id, joborder_id, status_id, site_id, user_id, recipient_email, recipient_name, subject, body, queue_status, attempts, created_at) VALUES (999999, 999999, 1020, 1, 1, \"sruthi.chimata@cloudfuze.com\", \"Queue E2E Test\", \"Queue E2E Test Subject\", \"If you see this, the async pipeline email queue works end to end.\", \"pending\", 0, NOW())"'
            docker exec --user www-data ats-app php /var/www/html/cron/process-pipeline-email-queue.php
            docker exec ats-mysql sh -c 'mysql -uatsuser -p"$MYSQL_PASSWORD" opencats -e "SELECT pipeline_email_queue_id, queue_status, attempts, last_error, sent_at FROM pipeline_email_queue WHERE candidate_id = 999999"'
