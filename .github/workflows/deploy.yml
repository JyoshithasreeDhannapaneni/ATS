name: Deploy to Production

# Manual trigger only — no push trigger. Deploying requires someone to
# deliberately click "Run workflow" on the Actions tab (requires write access
# to the repo, not admin). This is the approval gate: nothing deploys just
# because code was pushed to main.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/ATS
            git pull origin main
            docker compose -f docker-compose.local.yml up -d --build
