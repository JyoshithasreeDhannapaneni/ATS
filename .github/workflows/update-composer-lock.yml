name: Update Composer Lock

# Manual trigger only, same convention as deploy.yml — nothing runs
# automatically on push. Pick the branch that needs its composer.lock
# regenerated (e.g. the branch with an in-progress composer.json change)
# when dispatching this from the Actions tab.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: TEMP - validate hand-spliced lock installs like production does
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: TEMP - confirm firebase/php-jwt actually autoloads
        run: php -r "require 'vendor/autoload.php'; var_dump(class_exists('Firebase\\JWT\\JWT')); var_dump(class_exists('Firebase\\JWT\\JWK'));"
